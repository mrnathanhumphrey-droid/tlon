# ⛔⛔ THE ORACLE'S fly.toml HAS NO [http_service] AND NO PUBLIC IP. It is
# reachable only through a Cloudflare Tunnel, which is right for something
# behind Access and wrong for this. Copying it would produce an app that
# deploys clean, passes its own health check and answers nobody. Both halves of
# the fix are below and `tests/test_puzzle_public_ingress.py` fails if either
# disappears.
#
# ⛔ NOT DEPLOYED YET. `app`, the region, the GPU SKU and the volume must all be
# settled before `fly deploy` — see puzzle/README.md §deploy. The GPU line in
# particular is a COST decision and is Nate's, not a default.

app = "tlon-bench"
primary_region = "iad"             # Ashburn, Virginia — us-east, Nate's call

[build]
  dockerfile = "Dockerfile"

[env]
  # ⛔⛔ THIS ADAPTER SPEAKS 218 ROOTS; THE LIBRARY DEFAULT IS 156. Without the
  # expanded lexicon the gate refuses 49.9% of the turns in the speaker's own
  # training corpus, failing CLOSED — the machine comes up healthy and merely
  # seems inarticulate.
  # ⭐ STATED IN BOTH PLACES ON PURPOSE. The Dockerfile's ENV is what actually
  # carries it into the image; this line makes the requirement visible at the
  # deploy surface, where someone reading fly.toml decides what a machine gets.
  # ⛔ It is NOT the safety net — `speaker.py` refuses to load on a lexicon
  # hash mismatch, and that check is what makes the failure loud regardless of
  # which of these two files someone edits.
  TLON_LEXICON = "lexicon_expanded.yaml"
  TLON_HOST = "0.0.0.0"
  TLON_TRUST_PROXY = "1"
  TLON_HTTPS = "1"
  TLON_DB = "/data/bench.sqlite3"
  HF_HOME = "/data/hf"
  TLON_PRELOAD = "1"

# ── the public door ─────────────────────────────────────────────────────────
[http_service]
  internal_port = 8080
  force_https = true

  # ⭐ SCALE TO ZERO. The whole point of a link mailed to a short list is that it
  # is idle nearly all the time. A GPU machine left running is the single
  # largest cost in this project and it is billed whether or not anyone types.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # ⛔ ONE. Two machines means two copies of the weights and two benches that do
  # not share a SQLite file, so a reader's conversation would vanish whenever
  # the load balancer moved them.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 12
    soft_limit = 6

# ⛔ A generation takes ~5-8s on the box it was measured on, and a cold start
# adds the model load on top. The default grace is far too short for that: the
# health check fails, Fly restarts the machine, and it never finishes loading.
[[http_service.checks]]
  grace_period = "180s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/healthz"

# ── the weights and the bench live here ─────────────────────────────────────
# ⛔ The base model is ~14 GB and is NOT in the image. It is pulled to this
# volume on first boot, so an image rebuild does not re-push it. The SQLite
# bench also lives here, which is the other reason there is exactly one machine.
[[mounts]]
  source = "tlon_data"
  destination = "/data"
  initial_size = "40gb"

# ── the machine ─────────────────────────────────────────────────────────────
# ⛔⛔ A GPU, AND IT IS NOT OPTIONAL. This serves Qwen2.5-7B with a LoRA. Without
# `gpu_kind` Fly hands back a CPU machine, torch falls back, and every turn takes
# roughly a minute — slow, not broken, so nothing alerts and the app looks
# healthy. The Dockerfile names that same failure for the same reason.
#
# ⭐ L40S IS FLY'S GPU OFFERING, read 2026-09-24 rather than recalled: the GPU
# quickstart now redirects to fly.io/blog/wrong-about-gpu, which says they are
# NOT being retired — "if you're using Fly GPU Machines, don't freak out" — and
# that the L40S line stays. Measured need is 7.21 GiB of VRAM at 4-bit plus KV
# cache, so one card is far more than enough; there is no smaller SKU to choose.
#
# ⛔ `fly platform regions` does NOT report GPU availability, so `iad` is a
# choice that DEPLOY WILL VERIFY, not one that has been verified here. If it is
# refused for capacity, `ord` is the nearest alternative — do not silently drop
# `gpu_kind` to make the deploy succeed.
#
# ⛔ 16 GB of host RAM, not 8. The shards are loaded and quantised on the host
# before they reach the card; 8 GB was set when nothing had tried it.
[[vm]]
  gpu_kind = "l40s"
  gpus = 1
  memory = "16gb"
  cpus = 8
