  # ═══ IV. WHAT REMAINS ════════════════════════════════════════════════════
  # Abstractions. Concrete-weighted first was the ruling, so the four most
  # abstract are DECLARED AND HELD BACK (seed_2a: false) until the listener is
  # calibrated on I–III. The rest stay live because they are still enacted —
  # a looking, a drifting — not stated.

  - id: "M34"
    name: someone stranded, becoming part of it
    tier: 1
    notes: >
      Mrs Vhd Vhd. A changing, part of a mooning, a resting alongside, within
      which a vanishing. The vanishing nests inside the change because she does
      not disappear and then become moon — the becoming IS the disappearing.
    signature:
