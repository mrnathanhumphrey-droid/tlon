    signature:
      contains: [{root_any: [kön]}, {root_any: [xir], via: [tan]}]

  - id: "C16"
    name: the name you earn by moving
    tier: 1
    notes: >
      P3, P4. A moving, POST which a speaking. The name arrives after the act
      and because of it; `pos` orders them without tense.
    signature:
      contains: [{root_any: [xir]}, {root_any: [los], via: [pos]}]

  # ═══ THE WORD AS WORLD-BUILDING (P4) — head `los`, six ════════════════════
