# Tlön referent set CR — conscious-rap worldview. PHASE 11.
#
# ⛔ review_status gates execution. Nate sets it. Review tooling may read it.
#
# ─── PROVENANCE AND EXPRESSION-STRIP: THE PRECONDITION, AND HOW IT IS MET ──
#
# ⭐⭐ NO SOURCE TEXT WAS CONSULTED, RECALLED OR RECONSTRUCTED AT THE
# COMPILATION STEP. This set was built ONLY from the distilled philosophical
# positions Nate wrote in the Phase 11 brief, in his own words:
#
#   P1  knowledge-of-self / continuous self-creation
#   P2  the cipher as collective meaning-making-in-motion
#   P3  identity-as-enacted-not-possessed
#   P4  the word as world-building act
#   P5  meaning-collapse-as-operation (identity as operation, not noun)
#
# The brief IS the distillation. So the expression-strip is not something
# performed on ingested text — no expression was ingested. That is a stronger
# position than stripping: there was nothing to strip. Provenance of whatever
# Nate read to produce those five lines is his to confirm and keep confirmable;
# nothing downstream of this file depends on it, because nothing downstream ever
# saw it.
#
# TRACEABILITY IS THE RED-CHECK. Every note opens with the position(s) it
# derives from. `tools/expression_check.py` audits that every referent traces to
# a declared position, that no name or note carries quoted material, and that
# names are descriptions of impressions rather than titles or phrases. A
# referent that could be reconstructed back to a recognisable line would be
# expression, not idea — and would be rejected.
#
# ⛔⛔ THE MISREPORT THIS SET IS MOST EXPOSED TO, NAMED HERE.
# P5 — "identity as operation, not noun" — is LITERALLY THIS GRAMMAR'S CENTRAL
# RULE. The thematic fit is exact, and that is why the worldview was chosen.
# ⛔ IT IS NOT EVIDENCE THAT THE SET COLLIDES. Thematic 1:1 and structural
# underdetermination are different quantities; only f₂ measures the second. A
# set can fit Borges perfectly and still fail the gate, exactly as Cosmicomics
# did — that world was also a perfect thematic fit and came back at 10.5 %.
#
# ─── DESIGN: FLAT AND SHARED, THE INVERSE OF COSMICOMICS ──────────────────
#
# v2 failed because depth backfires combinatorially: d dependents give 2^d
# subsets and only keep=0 is strongly ambiguous, so each dependent added makes
# the ambiguous case rarer faster than it makes it more ambiguous.
#
# ⭐⭐ EVERY SIGNATURE HERE HAS EXACTLY ONE DEPENDENT (d=1), putting HALF of all
# subsets at keep=0. Collision comes from a cohort sharing one dense image-world:
# `los` heads 6, `kän` 6, `run` 5, `xir` 5, `rim` 4, `mreng` 3.
#
# ⛔ `forbid` 0/36, `matrix` 0/36 — Phase 6's isolation claim carries over.
# ⛔ No `at_depth` — nesting is the thing being avoided.
#
# Roots quoted from lexicon.yaml `e2b8527010231a81fd31b6eeb9de3d8c`.

review_status: UNREVIEWED     # ⛔ Nate sets this. Nothing runs until then.
schema_version: 2
grammar_family: southern

referents:

  # ═══ SELF-CREATION (P1) — head `run`, five ════════════════════════════════
  - id: "C01"
    name: knowing yourself as something still being made
    tier: 1
    notes: >
      P1. A changing, while a seeing. Knowledge-of-self is not inspection of a
      fixed thing — the seeing and the changing are simultaneous, which `mil`
      says exactly.
    signature:
      contains: [{root_any: [run]}, {root_any: [lan], via: [mil]}]

  - id: "C02"
    name: becoming what you said you were
    tier: 1
    notes: >
      P1, P4. A changing, because of a speaking. The word is causal here, not
      descriptive — which is the world-building position applied to the self.
    signature:
      contains: [{root_any: [run]}, {root_any: [los], via: [kra]}]

  - id: "C03"
    name: the self that is never finished
    tier: 1
    notes: >
      P1. A changing, despite an ending. Continuous self-creation stated as
      concession: endings happen and the changing does not stop.
    signature:
      contains: [{root_any: [run]}, {root_any: [ram], via: [xom]}]

  - id: "C04"
    name: remaking it every time
    tier: 1
    notes: >
      P1, P3. A changing, while a repeating. Shares its dependent with C10,
      C14, C28 and C33 — repetition is the cohort's densest shared root.
    signature:
      contains: [{root_any: [run]}, {root_any: [rän], via: [mil]}]

  - id: "C05"
    name: waking up a different person
    tier: 1
    notes: >
      P1. A changing, POST a waking. `pos` puts the waking first without tense,
      which π would strip.
    signature:
      contains: [{root_any: [run]}, {root_any: [mim], via: [pos]}]

  # ═══ THE CIPHER (P2) — head `kän`, six ════════════════════════════════════
  - id: "C06"
    name: the circle making meaning while it turns
    tier: 1
    notes: >
      P2. A circling, amid a speaking. The meaning is not produced by the
      circle and then held; it exists only in the turning, which is what
      `hlim` (AMID) carries.
    signature:
      contains: [{root_any: [kän]}, {root_any: [los], via: [hlim]}]

  - id: "C07"
    name: passing it around and it grows
    tier: 1
    notes: >
      P2. A circling, while a rising. Collective meaning-making as accretion
      with no owner of the increment.
    signature:
      contains: [{root_any: [kän]}, {root_any: [pel], via: [mil]}]

  - id: "C08"
    name: the circle with no one at its head
    tier: 1
    notes: >
      P2. A circling, despite a halting. No leader is predicated because no
      person is; the absence is written as concession, not as `forbid`.
    signature:
      contains: [{root_any: [kän]}, {root_any: [kön], via: [xom]}]

  - id: "C09"
    name: everyone in it, no one holding it
    tier: 1
    notes: >
      P2, P3. A circling, part of which a teeming. `fral` is how this grammar
      says a collective without counting members.
    signature:
      contains: [{root_any: [kän]}, {root_any: [fral], via: [nix]}]

  - id: "C10"
    name: the turn that comes back around to you
    tier: 1
    notes: >
      P2. A circling, while a repeating. Deliberately near-identical to C04
      and C14 once the dependent is withheld.
    signature:
      contains: [{root_any: [kän]}, {root_any: [rän], via: [mil]}]

  - id: "C11"
    name: stepping in without being asked
    tier: 1
    notes: >
      P2, P3. A circling, while an approaching. Entry as an act, not a
      permission.
    signature:
      contains: [{root_any: [kän]}, {root_any: [krun], via: [mil]}]

  # ═══ IDENTITY ENACTED (P3) — head `xir`, five ═════════════════════════════
  - id: "C12"
    name: who you are is what you just did
    tier: 1
    notes: >
      P3. A moving, causing a seeing. The identity is downstream of the act,
      which `kra` (CAUS) states directly.
    signature:
      contains: [{root_any: [xir]}, {root_any: [lan], via: [kra]}]

  - id: "C13"
    name: nothing underneath the doing
    tier: 1
    notes: >
      P3, P5. A moving, despite a resting. The strongest form of the position:
      there is no substrate that persists between acts.
    signature:
      contains: [{root_any: [xir]}, {root_any: [tang], via: [xom]}]

  - id: "C14"
    name: proving it again every time
    tier: 1
    notes: >
      P3. A moving, while a repeating. Identity as something that has to be
      re-enacted rather than retained.
    signature:
      contains: [{root_any: [xir]}, {root_any: [rän], via: [mil]}]

  - id: "C15"
    name: stopping, and being no one
    tier: 1
    notes: >
      P3. A halting, ERE a moving. Inverts C13 — same two roots, opposite
