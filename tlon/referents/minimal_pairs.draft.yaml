  # ── P9 · orientation — apart vs together ──────────────────────────────────
  - id: "47"
    name: a scattering crowd
    tier: 1
    minimal_pair: P9
    contrast: orientation
    signature:
      contains:
        - {root_any: [xir], orient_any: [sil]}
        - {root_any: [fral], via: [mil]}

  - id: "48"
    name: a gathering crowd
    tier: 1
    minimal_pair: P9
    contrast: orientation
    signature:
      contains:
