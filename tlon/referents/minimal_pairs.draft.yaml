        - {root_any: [fral], via: [mil]}

  # ── P10 · aspect kind — ONE root, nothing else to go on ───────────────────
  - id: "49"
    name: a flickering light
    tier: 1
    minimal_pair: P10
    contrast: aspect
    notes: >
      The purest pair: a SINGLE root, so bag-of-roots is at chance even in
      principle. Also the channel phase 3's cipher control scrambles — so this
      doubles as an early read on whether aspect is legible at all.
    signature:
      contains:
        - {root_any: [hräx], aspect_root_any: [nim]}

  - id: "50"
