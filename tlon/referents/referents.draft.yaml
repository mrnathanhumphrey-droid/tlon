# Tlön referent set — Tier 1 (2a seed), Tier 2 and Tier 3 declared but excluded.
#
# review_status gates execution. Nothing may run on this file until Nate sets it
# to REVIEWED. Review tooling may read it as-is; the self-play loop may not.
#
# A signature is a PARTIAL GRAPH PATTERN, never a single root (PHASE2_DESIGN §6d).
# `contains` patterns must each match a DISTINCT node anywhere in the scene.
#
# `via` names the relators a node may attach to the matrix by. It is REQUIRED
# reading, not decoration: an earlier draft left every relator unspecified, the
# witness builder defaulted to `u` (BEYOND), and all twenty pegs rendered as
# "beyond ⟨something⟩" — injecting a spatial claim none of them made. If a
# signature genuinely does not care how two happenings relate, omit `via`
# deliberately and say so in the notes.
#
# Overlaps between referents are DELIBERATE — see the water cluster (03/06/08/
# 15/20). Nate ruled 2026-08-18 that 03 and 15 may match the same scene.
#
# Roots quoted from lexicon.yaml `49475a61a308a2beeb7434693eff5c44`.

review_status: REVIEWED     # Nate, 2026-08-18 — execution unblocked
schema_version: 2
grammar_family: southern

referents:

  - id: "01"
    name: a mirror
    tier: 1
    validated: false        # option C — Nate: "alright for now", 2026-08-18
    notes: >
      Tlön denies the object, so a mirror cannot be a reflecting THING. It is a
      seeing that comes back: a perception set AGAINST itself and standing AS
      another perception. lan = "it sees, is beheld". No new roots minted.
      Narrowed option A (doubling/facing verbs, never standing-for verbs) is
      held in reserve if this renders as mush.
    signature:
      contains:
        - {root_any: [lan], orient_any: [kon, hren]}
        - {root_any: [lan, rän, rom], via: [hlin]}

  - id: "02"
    name: wind moving through tall grass
    tier: 1
    notes: >
      REPLACES "a tiger" (Nate, 2026-08-18: weak, swap it). At the time the
      lexicon had no root for striping, so the tiger was carried by hunting amid
      a yellowing and a blackening — thin. This peg is Thoreau territory and
      every part of it is directly rooted: tlan winds, xel greens, frim undulates.
      The pattern/marking family (tlex tlix tlox tlux tläx) was minted the same
      day, so a tiger peg is now expressible — but it is NOT being swapped back
      in unreviewed. Raise it as a fresh proposal if you want it.
    signature:
      contains:
        - {root_any: [tlan]}
        - {root_any: [xel], via: [hlim]}
        - {root_any: [frim], via: [mil]}

  - id: "03"
    name: the moon over water
    tier: 1
    notes: >
      The golden peg — Borges' own line renders here. Deliberately does NOT pin
      the matrix root: the mooning may be matrix or subordinate. `u` (BEYOND) is
      earned here rather than defaulted — the relation really is spatial.
      Overlaps 15 by Nate's ruling.
    signature:
      contains:
        - {root_any: [mlö]}
        - {root_any: [fang, fox, frim, föm, mör], via: [u]}

  - id: "04"
    name: a labyrinth
    tier: 1
    signature:
      contains:
        - {root_any: [kron, plin]}
        - {root_any: [rän, säx, klung], via: [hlin]}

  - id: "05"
    name: a single gold coin
    tier: 1
    notes: >
      "Single" is not expressible as a count of objects — QUANT counts occasions,
      not things — so it is deliberately absent rather than faked.
    signature:
      contains:
        - {root_any: [hom]}
        - {root_any: [präx], via: [hlin]}
        - {root_any: [flix, pux], via: [hlin]}

  - id: "06"
    name: a pond at dawn
    tier: 1
    notes: fox = "it pools, stands still as water" — the stillness distinguishes it from 15.
    signature:
      contains:
        - {root_any: [fox]}
        - {root_any: [fis, lir], via: [mil]}

  - id: "07"
    name: a train whistle heard from far off
    tier: 1
    notes: >
      Anchored on the HEARING, not the whistle — the impression is the reception.
      `nix` (PART, out of) rather than BEYOND: the hearing comes OUT OF the
      ringing. Distance carried by ORIENT, the only distance the grammar has.
    signature:
      contains:
        - {root_any: [leng], orient_any: [xun, ung, nong]}
        - {root_any: [mreng, mräng, hlax], via: [nix]}

