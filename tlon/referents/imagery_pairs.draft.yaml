# Tlön — IMAGERY PAIRS v2. Ten scenes, each from both participants' side.
#
# THE RULE, found by measurement not by argument:
#   an imagery pair stays honest only when both perspectives are about ALL the
#   same happenings. Only the VANTAGE moves.
#
# v1 drafted ten rich scenes and nine of them leaked -- bag-of-roots scored
# 94-100%, because each side had private business the other could not see. The
# stone's rounding exists only from the stone's side; the water's scattering
# only from the water's. Those are genuinely different events, so the roots
# correctly differed and the pair correctly failed.
#
# The one that survived (light/night, 51.1%) shared everything: the glowing is
# in the night's view too, the darkening is in the light's. Same three
# happenings, and only which is matrix plus the orientation change hands.
#
# Every pair below is built to that rule. It costs some of the richest scenes --
# stone/water, moth/lamp -- and buys pairs that are two real images AND cannot
# be told apart by roots.
#
# review_status gates execution. Roots quoted from lexicon `e2b8527010231a81fd31b6eeb9de3d8c`.

review_status: REVIEWED     # Nate, 2026-08-20 — "yes much much better"
schema_version: 3
grammar_family: southern

referents:

  # ── J1 · a lit window, from outside, at night ─────────────────────────────
  - id: "51"
    name: the light's side — going out into the dark
    tier: 1
    minimal_pair: J1
    contrast: perspective
    notes: >
      The original survivor and the template for the rest. Glowing, darkening
      and bounding are all present to both; only the vantage turns.
    signature:
      contains:
        - {root_any: [hräx], orient_any: [pox]}
        - {root_any: [flex], via: [u]}
        - {root_any: [säx], via: [hlin]}

