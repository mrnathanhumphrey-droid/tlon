deviations_from_spec_v0_1:
- was: codas {n ng r s l x}
  now: codas {n ng m r s l x}
  why: 'SPEC CHANGE: admitted ''m'' to complete the nasal natural class n/ng/m. Rescues tim/sim/hom/fim.
    Stop codas p/t/k stay ILLEGAL: no attested Borges form has one (hlör, fang, mlö all end in sonorant
    or nothing).'
- was: clusters {hl ml tl kl fl xl hr tr kr}
  now: clusters {p t k f x h m} x {l r}
  why: 'SPEC CHANGE: the 9-cluster list was ad hoc. Made it the full obstruent+liquid series (14). Rescues
    plas/plun/frax/fro/fral/pral. Syllable space 21*7*7=1029 -> 26*7*8=1456.'
- was: 'onsets: add d, v?'
  now: REFUSED
  why: Voiced obstruents are absent from every attested form. The inventory is deliberately voiceless;
    dul/dur/ver were fixed instead of the table.
